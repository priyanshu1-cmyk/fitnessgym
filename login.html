<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Portal Login | Holistic Fitness</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background-color: #080a0e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: #121722;
      border: 1px solid #283347;
      border-radius: 16px;
      padding: 32px 26px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }
    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      margin-bottom: 6px;
    }
    .brand-title span { color: #ff2a4b; }
    .subtitle {
      font-size: 0.82rem;
      color: #8e9bb0;
      margin-bottom: 22px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #080a0e;
      border: 1px solid #283347;
      border-radius: 8px;
      color: white;
      outline: none;
      font-size: 0.9rem;
    }
    .form-group input:focus { border-color: #ff2a4b; }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #ff2a4b;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 18px rgba(255, 42, 75, 0.35);
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 0.82rem;
      color: #8e9bb0;
      text-decoration: none;
    }
    .back-home:hover { color: #ffffff; text-decoration: underline; }
    /* Dashboard view after login */
    #dashView { display: none; }
    .stat-chip {
      background: #080a0e;
      border: 1px solid #283347;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- State 1: Login Form -->
    <div id="loginView">
      <div class="brand-title">HOLISTIC <span>FITNESS</span></div>
      <p class="subtitle">Member Cloud Access</p>

      <form onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Member ID / Mobile Number</label>
          <input type="text" id="user" placeholder="e.g. MEMBER-8077" required>
        </div>
        <div class="form-group">
          <label>Password / PIN</label>
          <input type="password" id="pass" placeholder="••••" required>
        </div>
        <button type="submit" class="btn-submit">Sign In to Portal ➔</button>
      </form>

      <!-- Main website link -->
      <a href="index.html" class="back-home">← Wapas Main Website Par Jayein</a>
    </div>

    <!-- State 2: Member Dashboard (After Login) -->
    <div id="dashView">
      <h3 style="font-family: 'Montserrat', sans-serif; font-size: 1.15rem; margin-bottom: 4px;">Welcome, Member!</h3>
      <p style="font-size: 0.8rem; color: #10b981; margin-bottom: 16px;">● Active Membership Plan</p>
      
      <div class="stat-chip">
        <small style="color:#8e9bb0; font-size: 0.72rem;">CURRENT PLAN</small>
        <h4 style="font-size: 1rem; margin-top: 2px;">Quarterly Fitness + Daily Yoga</h4>
      </div>

      <div class="stat-chip">
        <small style="color:#8e9bb0; font-size: 0.72rem;">TODAY'S SCHEDULE</small>
        <p style="font-size: 0.85rem; margin-top: 4px;">Upper Body Strength (Chest & Back) • 6:00 PM</p>
      </div>

      <button onclick="logout()" class="btn-submit" style="background:#1e2430; box-shadow:none; margin-top:10px;">Sign Out</button>
      <a href="index.html" class="back-home">← Main Website Par Jayein</a>
    </div>
  </div>

  <script>
    function handleAuth(e) {
      e.preventDefault();
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashView').style.display = 'block';
    }
    function logout() {
      document.getElementById('dashView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
    }
  </script>

</body>
</html>
